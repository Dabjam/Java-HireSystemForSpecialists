spring:
  application:
    name: hr-system
  main:
    banner-mode: console
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5425}/${DB_NAME:hr_system_db}?stringtype=unspecified
    username: ${DB_USER:${DB_USERNAME:hr_user}}
    password: ${DB_PASSWORD:hr_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8088

hr:
  scraper:
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
    request-delay-ms: 500
    max-pages: 5
    max-retries: 3

logging:
  level:
    root: WARN
    com.hrsystem: INFO
    org.flywaydb: INFO
